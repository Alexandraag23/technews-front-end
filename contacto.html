<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - TechNews</title>

    css/estilos.css

</head>

<body>

<header>

    <h1>TechNews</h1>

    <nav>
        index.htmlInicio</a>
        noticias.htmlNoticias</a>
        favoritos.htmlFavoritos</a>
        contacto.htmlContacto</a>
    </nav>

</header>

<main>

    <h2>Contáctanos</h2>

    <form id="formulario-contacto">

        <label for="nombre">Nombre</label>
        <input
            type="text"
            id="nombre"
            required
        >

        <label for="correo">Correo electrónico</label>
        <input
            type="email"
            id="correo"
            required
        >

        <label for="asunto">Asunto</label>
        <input
            type="text"
            id="asunto"
            required
        >

        <label for="mensaje">Mensaje</label>

        <textarea
            id="mensaje"
            required>
        </textarea>

        <button type="submit">
            Enviar mensaje
        </button>

    </form>

    <p id="confirmacion"></p>

</main>

<footer>
    <p>TechNews - Noticias de tecnología</p>
</footer>

js/contacto.jsscript>

</body>
</html>
