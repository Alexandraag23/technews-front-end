<form id="formulario-contacto">

    <label for="nombre">
        Nombre
    </label>

    <input
        type="text"
        id="nombre"
        required
    >

    <label for="correo">
        Correo electrónico
    </label>

    <input
        type="email"
        id="correo"
        required
    >

    <label for="asunto">
        Asunto
    </label>

    <input
        type="text"
        id="asunto"
        required
    >

    <label for="mensaje">
        Mensaje
    </label>

    <textarea
        id="mensaje"
        required>
    </textarea>

    <button type="submit">
        Enviar
    </button>

</form>

<p id="confirmacion"></p>

js/contacto.jsscript>
